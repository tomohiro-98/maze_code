<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめてのプログラミング</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">
    <h1>はじめてのプログラミング</h1>

    <div class="game-layout">
      <!-- コマンド入力エリア -->
      <section class="controls" aria-labelledby="program-title">
        <h2 id="program-title">プログラムを入力してください</h2>

        <textarea
          id="commands"
          rows="3"
          placeholder="例：FFFRFRFL"
          spellcheck="false"
          aria-label="実行するプログラム"
        ></textarea>

        <!-- 入力したコマンドを表示する場所 -->
        <div
          id="command-display"
          class="command-display"
          aria-label="実行するプログラム"
        ></div>

        <div class="button-row">
          <button id="startButton" class="primary" type="button">
            スタート
          </button>

          <button id="resetButton" type="button">
            リセット
          </button>
        </div>

        <p id="status" class="status" aria-live="polite">
          プログラムを入力してスタートしてください。
        </p>
      </section>

      <!-- 迷路表示エリア -->
      <section class="maze-section" aria-labelledby="maze-title">
        <h2 id="maze-title" class="visually-hidden">迷路</h2>
        <div id="maze" class="maze" aria-label="8x8迷路"></div>
      </section>
    </div>

    <!-- 回答例 -->
    <section aria-labelledby="example-title">
      <h2 id="example-title">回答例</h2>

      <div class="example-buttons">
        <button type="button" data-example="A">回答例A</button>
        <button type="button" data-example="B">回答例B</button>
        <button type="button" data-example="C">回答例C</button>
        <button type="button" data-example="D">回答例D</button>
      </div>
    </section>

    <!-- デバッグ操作 -->
    <!-- <section
      id="debug-control-panel"
      class="debug-control-panel"
      aria-label="デバッグ操作"
    >
      <div id="debug-controls" class="debug-controls">
        <button type="button" data-direction="up" aria-label="上へ">↑</button>

        <div class="debug-middle-buttons">
          <button type="button" data-direction="left" aria-label="左へ">←</button>
          <button type="button" data-direction="down" aria-label="下へ">↓</button>
          <button type="button" data-direction="right" aria-label="右へ">→</button>
        </div>
      </div>

      <button
        type="button"
        id="toggle-player-button"
        aria-pressed="false"
      >
        🐭
      </button>
    </section> -->
  </main>

  <script src="./js/maze-data.js"></script>
  <script src="./js/maze-engine.js"></script>
  <script src="./js/command-utils.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/tests.js"></script>
  <!-- <script src="./js/debug-controls.js"></script> -->
  <script src="./js/app.js"></script>
</body>
</html>
