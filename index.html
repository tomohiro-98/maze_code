<div class="game-layout">
  <section class="controls">
    <label for="commands">プログラムを入力してください</label>

    <textarea
      id="commands"
      rows="3"
      placeholder="例：FFRFFL"
      spellcheck="false"
    ></textarea>

    <div class="button-row">
      <button id="startButton" class="primary">スタート</button>
      <button id="resetButton">リセット</button>
    </div>

    <p id="status" class="status">
      プログラムを入力してスタートしてください。
    </p>
  </section>

  <section class="maze-section">
    <div id="maze" class="maze" aria-label="8x8迷路"></div>
  </section>
</div>

<h2>回答例</h2>
<div class="example-buttons">
  <button type="button" data-example="A">回答例A</button>
  <button type="button" data-example="B">回答例B</button>
  <button type="button" data-example="C">回答例C</button>
  <button type="button" data-example="D">回答例D</button>
</div>
